<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
<defs>
  <pattern id="fine" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#555"/><rect x="2" y="2" width="2" height="2" fill="#555"/></pattern>
  <pattern id="mid" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#777"/><rect x="7" y="7" width="7" height="7" fill="#777"/></pattern>
  <pattern id="coarse" width="56" height="56" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#999"/><rect x="28" y="28" width="28" height="28" fill="#999"/></pattern>
  <linearGradient id="low" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8a8a"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  <style>
    .t { font-size: 20px; font-weight: bold; fill: #222; }
    .h { font-size: 14px; font-weight: bold; fill: #222; }
    .b { font-size: 13px; fill: #333; }
    .s { font-size: 11px; fill: #444; }
    .m { font-size: 12px; font-family: Menlo, Consolas, monospace; fill: #222; }
    .box { fill: #f7f7f7; stroke: #bbb; stroke-width: 1.5; }
    .ar { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
</defs>
<rect width="960" height="620" fill="#ffffff"/>
<text x="24" y="34" class="t">band loss: frequency-weighted residual (toolkit/util/losses.py: band_loss)</text>
<text x="24" y="56" class="b">The plain MSE penalizes detail the noise has already destroyed. This loss keeps each frequency band of the residual</text>
<text x="24" y="74" class="b">only as far as that band is still recoverable at the sample's noise level t.</text>

<!-- step 1: residual -->
<rect x="24" y="90" width="150" height="120" class="box"/>
<text x="99" y="112" text-anchor="middle" class="h">1. residual</text>
<text x="99" y="134" text-anchor="middle" class="m">pred - target</text>
<text x="99" y="156" text-anchor="middle" class="s">x0, velocity or epsilon:</text>
<text x="99" y="170" text-anchor="middle" class="s">one picture scaled by t,</text>
<text x="99" y="184" text-anchor="middle" class="s">no conversion needed</text>
<path d="M176,150 L212,150" class="ar"/>

<!-- step 2: bands -->
<rect x="216" y="90" width="310" height="200" class="box"/>
<text x="371" y="112" text-anchor="middle" class="h">2. split into Laplacian bands</text>
<rect x="236" y="128" width="56" height="56" fill="url(#fine)" stroke="#d9534f" stroke-width="2"/><rect x="308" y="128" width="56" height="56" fill="url(#mid)" stroke="#f0a030" stroke-width="2"/><rect x="380" y="128" width="56" height="56" fill="url(#coarse)" stroke="#3c9d5d" stroke-width="2"/><rect x="452" y="128" width="56" height="56" fill="url(#low)" stroke="#3b7ddd" stroke-width="2"/>
<text x="264" y="202" text-anchor="middle" class="s" fill="#d9534f">fine</text>
<text x="336" y="202" text-anchor="middle" class="s">mid</text>
<text x="408" y="202" text-anchor="middle" class="s">coarse</text>
<text x="480" y="202" text-anchor="middle" class="s">low (8x8 pool)</text>
<text x="371" y="228" text-anchor="middle" class="m">band_k = low_k - low_{k+1}</text>
<text x="371" y="244" text-anchor="middle" class="s">low_k = residual pooled over 2^k x 2^k cells,</text>
<text x="371" y="258" text-anchor="middle" class="s">resampled to full size; bands sum to the residual</text>
<text x="371" y="272" text-anchor="middle" class="s">pred and target split separately (linear)</text>
<text x="371" y="286" text-anchor="middle" class="s">video: per frame over H, W</text>
<path d="M528,150 L564,150" class="ar"/>

<!-- step 3: weights -->
<rect x="568" y="90" width="368" height="200" class="box"/>
<text x="752" y="112" text-anchor="middle" class="h">3. weight each band by its recoverability at t</text>
<text x="588" y="138" class="m">flow: snr(t) = ((1-t)/t)^2, t = steps/1000</text>
<text x="588" y="154" class="m">ddpm: snr(t) = alpha_bar / (1 - alpha_bar)</text>
<text x="588" y="178" class="m">snr_k  = snr(t) * P_clean[k] / P_noise[k]</text>
<text x="588" y="194" class="m">w_k    = snr_k / (1 + snr_k)</text>
<text x="588" y="218" class="s">P_clean[k], P_noise[k]: mean squared band k of the</text>
<text x="588" y="232" class="s">batch's clean latents and of its noise, measured per</text>
<text x="588" y="246" class="s">batch: no 1/f prior, any VAE, pyramid noise just works.</text>
<text x="588" y="268" class="s">t -> 0: every w_k = 1, the loss IS the plain MSE.</text>
<text x="588" y="282" class="s">t -> 1: only the low band keeps a weight.</text>

<!-- step 4: combine -->
<path d="M371,292 L371,330" class="ar"/>
<rect x="216" y="334" width="310" height="150" class="box"/>
<text x="371" y="356" text-anchor="middle" class="h">4. filtered residual, squared</text>
<text x="371" y="382" text-anchor="middle" class="m">filtered = sum_k  w_k * band_k</text>
<text x="371" y="400" text-anchor="middle" class="m">loss     = filtered ** 2</text>
<text x="371" y="424" text-anchor="middle" class="s">elementwise, pred's shape: masks, timestep weights,</text>
<text x="371" y="438" text-anchor="middle" class="s">LossScaler and prior loss apply downstream unchanged</text>
<text x="371" y="462" text-anchor="middle" class="s">config: train.loss_type = "band"</text>

<!-- weight curves plot -->
<text x="560" y="318" class="h">w_k(t) for typical latent band powers</text>
<rect x="560" y="330" width="340" height="150" fill="#fcfcfc" stroke="#999"/>
