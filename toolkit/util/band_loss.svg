<text x="554" y="484" text-anchor="end" class="s">0</text>
<text x="560" y="496" class="s">t = 0 (clean)</text>
<text x="900" y="496" text-anchor="end" class="s">t = 1 (noise)</text>
<text x="730.0" y="512" text-anchor="middle" class="s">fine detail drops out first, global layout last</text>

<!-- why -->
<rect x="24" y="500" width="912" height="96" class="box"/>
<text x="40" y="522" class="h">why</text>
<text x="40" y="542" class="b">Images carry most power at low frequencies and white noise is flat, so at noise level t each band has its own</text>
<text x="40" y="558" class="b">signal-to-noise ratio and the fine ones go under first. Above that cutoff the best possible estimate is a blur, and an</text>
<text x="40" y="574" class="b">MSE gradient on those bands is a coin flip. Dropping them removes gradient noise at high t; at low t nothing changes.</text>
<text x="40" y="590" class="b">The depth-wise code heads give coarse-to-fine supervision across layers; this gives it across timesteps. They compose.</text>
</svg>
